name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python tools
        run: python -m compileall -q scripts skills tests

      - name: Run productization unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Exercise tool help paths
        run: |
          python scripts/install_codex_skills.py --help
          python skills/linear-project-governance/scripts/plan_tool.py --help
          python skills/linear-delivery-audit/scripts/profile_tool.py --help

      - name: Build reproducible standalone Skill archives
        run: python scripts/build_skill_archives.py

      - name: Validate Skill sources and distributions
        run: python tests/validate_skills.py

      - name: Upload validated Skill archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linear-gpt-pm-skills-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
