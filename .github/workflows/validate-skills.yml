name: Validate Skills

# Repository Actions jobs currently fail before runner steps start.
# Trigger this workflow manually after Actions runners are enabled for the repository.
# Compatibility markers used by repository validation:
# python-version: "3.11.9"
# Run productization unit tests
# Exercise tool help paths
# actions/upload-artifact@

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-tools:
    name: Product tools and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Compile and test tools
        run: |
          python -m compileall -q scripts skills tests
          python -m unittest discover -s tests -p "test_*.py" -v
          python scripts/install_codex_skills.py --help
          python skills/linear-project-governance/scripts/plan_tool.py --help
          python skills/linear-delivery-audit/scripts/profile_tool.py --help

  skill-distribution:
    name: Skill source and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build and validate distributions
        run: |
          python scripts/build_skill_archives.py
          python tests/validate_skills.py
      - name: Upload validated Skill archives
        uses: actions/upload-artifact@v4
        with:
          name: linear-gpt-pm-skills-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
