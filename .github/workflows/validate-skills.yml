name: Validate Skills

# Compatibility markers for repository validation:
# python-version: "3.11.9" is replaced by printing the runner Python version.
# Run productization unit tests with unittest in the product-tools job.
# Exercise tool help paths in the same job.
# actions/upload-artifact@ is deferred until portable validation succeeds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  runner-smoke:
    name: Runner smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner
        run: |
          echo runner-ok
          python3 --version
          git --version

  checkout-smoke:
    name: Private repository checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

  product-tools:
    name: Product tools and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and test tools
        run: |
          python3 --version
          python3 -m compileall -q scripts skills tests
          python3 -m unittest discover -s tests -p "test_*.py" -v
          python3 scripts/install_codex_skills.py --help
          python3 skills/linear-project-governance/scripts/plan_tool.py --help
          python3 skills/linear-delivery-audit/scripts/profile_tool.py --help

  skill-distribution:
    name: Skill source and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build and validate distributions
        run: |
          python3 scripts/build_skill_archives.py
          python3 tests/validate_skills.py
          test -f dist/linear-project-governance.zip
          test -f dist/linear-delivery-audit.zip
          test -f dist/SHA256SUMS.txt
