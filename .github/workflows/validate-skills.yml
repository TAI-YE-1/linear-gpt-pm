name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-tools:
    name: Product tools and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Compile Python tools
        run: python -m compileall -q scripts skills tests
      - name: Run productization unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Exercise tool help paths
        run: |
          python scripts/install_codex_skills.py --help
          python skills/linear-project-governance/scripts/plan_tool.py --help
          python skills/linear-delivery-audit/scripts/profile_tool.py --help

  skill-distribution:
    name: Skill source and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build reproducible standalone Skill archives
        run: python scripts/build_skill_archives.py
      - name: Validate Skill sources and distributions
        run: python tests/validate_skills.py
      - name: Upload validated Skill archives
        uses: actions/upload-artifact@v4
        with:
          name: linear-gpt-pm-skills-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
